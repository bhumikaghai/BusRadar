<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>BusRadar - Real-Time Transit Intelligence</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    primary: "#00327d",
                    "primary-hover": "#002561"
                },
                fontFamily: {
                    sans: ["Inter", "sans-serif"]
                }
            }
        }
    }
</script>
<style>
    body {
        font-family: 'Inter', sans-serif;
        background-color: #f1f5f9;
        margin: 0;
        padding: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined[data-weight="fill"] {
        font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
</style>
</head>
<body class="font-sans antialiased select-none">

<!-- Fixed Native App Chassis -->
<div class="max-w-md mx-auto h-[100dvh] max-h-[850px] bg-white flex flex-col relative overflow-hidden w-full shadow-2xl rounded-none md:rounded-3xl border border-slate-200">

    <!-- Floating Language Toggle Button (Upscaled) -->
    <button id="btn-lang-toggle" class="absolute top-4 right-4 z-30 bg-white/95 backdrop-blur-md border border-slate-200 text-slate-800 rounded-full px-3.5 py-2 text-sm font-bold shadow-md hover:bg-slate-50 transition-all flex items-center gap-1.5 cursor-pointer">
        <span class="material-symbols-outlined text-[18px] text-primary">translate</span>
        <span>हिन्दी</span>
    </button>

    <!-- Top 45%: Branding and Illustration -->
    <div class="flex-1 flex flex-col items-center justify-center relative bg-slate-50 overflow-hidden border-b border-slate-100 z-10 pt-12 pb-6 px-6">
        <div class="flex items-center gap-2.5 mb-5">
            <div class="w-11 h-11 rounded-2xl bg-primary flex items-center justify-center text-white shadow-md">
                <span class="material-symbols-outlined text-[26px]" data-weight="fill">directions_bus</span>
            </div>
            <h1 data-i18n="app_title" class="text-4xl font-black text-primary tracking-tight">
                BusRadar
            </h1>
        </div>
        <!-- Vector Bus Illustration -->
        <div class="relative w-full max-w-xs flex items-center justify-center z-20">
            <img class="w-full h-auto max-h-48 object-contain drop-shadow-sm" alt="Modern city bus transit illustration" src="https://lh3.googleusercontent.com/aida-public/AB6AXuALzLub12atI3_ZZI_Pa367To0sfooXI1taJpB9D5S6HUGOKpYRpHR1cB40k9RGgYS55vyIbdZlccvloBoFLTnrUq3tQ1H9mWx-hxw25wwdz0xCnJy61cT_ya_fhYXbfzBl4lq4Cj9M7VZy1-QKV929rTDLPz2LEPEPkiFmmkCwCeACQK6qxgCiRECFAOuDJbQpQoGcXcXwS-_-gkckUKSbhyW3WQMUlc_IJpdlPsuU4qrm4wYH39Tv"/>
        </div>
    </div>

    <!-- Bottom 55%: Action Area (Upscaled Touch Targets) -->
    <div class="flex flex-col justify-between p-6 bg-white relative z-20 flex-1">
        <div class="flex flex-col gap-4 w-full my-auto">
            <!-- Primary Action: Passenger Tracking Flow (h-16) -->
            <button onclick="window.location.href='../search_booking_dashboard/code.html'" class="w-full h-16 bg-primary hover:bg-[#002561] text-white rounded-2xl flex items-center justify-between px-6 shadow-lg shadow-primary/25 active:scale-[0.98] transition-all cursor-pointer">
                <div class="flex flex-col text-left">
                    <span data-i18n="onboard_pass_btn" class="font-extrabold text-base text-white tracking-wide">Continue as Passenger</span>
                    <span data-i18n="onboard_pass_sub" class="text-xs text-blue-200 font-medium">No login required to track buses</span>
                </div>
                <span class="material-symbols-outlined text-[26px] text-white">arrow_forward</span>
            </button>

            <!-- Divider -->
            <div class="flex items-center w-full my-1">
                <div class="flex-grow border-t border-slate-200"></div>
                <span data-i18n="onboard_or" class="px-4 text-slate-400 text-xs uppercase tracking-wider font-bold">or</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>

            <!-- Secondary Action: Driver Flow (h-16) -->
            <button id="btn-driver-login-trigger" onclick="window.location.href='../otp_system/code.html'" class="w-full h-16 bg-slate-50 hover:bg-slate-100 border-2 border-slate-200 text-slate-800 rounded-2xl flex items-center justify-center gap-3 px-6 active:scale-[0.98] transition-all cursor-pointer font-extrabold text-base shadow-xs">
                <span class="material-symbols-outlined text-[22px] text-slate-700" data-weight="fill">lock</span>
                <span data-i18n="onboard_driver_btn">Authorized Driver Login</span>
            </button>
        </div>

        <!-- Terms Footer -->
        <div class="pt-4 text-center">
            <p class="text-slate-500 text-xs font-medium">
                <span data-i18n="onboard_terms">By continuing, you agree to BusRadar's</span> <a data-i18n="onboard_terms_link" class="text-primary font-bold underline hover:text-primary-hover transition-colors" href="#">Terms of Service</a>.
            </p>
        </div>
    </div>
</div>

<!-- Universal i18n Engine Script -->
<script src="../i18n.js"></script>
</body>
</html>
