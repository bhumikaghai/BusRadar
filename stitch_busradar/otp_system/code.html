<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>BusRadar - Driver OTP Verification Gateway</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4de082",
                        "primary-container": "#39ff14"
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b;
            margin: 0;
            padding: 0;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .otp-input:focus {
            outline: none;
            border-color: #4de082;
            box-shadow: 0 0 16px rgba(77, 224, 130, 0.4);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .shake-animation {
            animation: shake 0.35s ease-in-out;
        }
    </style>
</head>
<body class="font-sans antialiased select-none text-zinc-100">

    <!-- Fixed Native App Chassis -->
    <div class="max-w-md mx-auto h-[100dvh] max-h-[850px] bg-black flex flex-col justify-between p-6 relative overflow-hidden w-full shadow-2xl rounded-none md:rounded-3xl border border-zinc-800">
        
        <!-- Ambient Glow -->
        <div class="absolute top-0 left-0 w-full h-full opacity-20 pointer-events-none" style="background: radial-gradient(circle at 50% -10%, rgba(77, 224, 130, 0.25) 0%, transparent 65%);"></div>

        <!-- 1. Top Navigation Bar (Standardized h-16) -->
        <header class="flex items-center justify-between z-20 shrink-0 h-16 border-b border-zinc-800/80 -mx-6 px-6 mb-2">
            <button onclick="window.location.href='../onboarding_entry/code.html'" class="w-11 h-11 rounded-2xl bg-zinc-900 border border-zinc-800 text-zinc-300 hover:text-white flex items-center justify-center transition-all cursor-pointer" title="Back to Gateway">
                <span class="material-symbols-outlined text-[22px]">arrow_back</span>
            </button>
            <span data-i18n="otp_badge" class="text-xs tracking-widest uppercase text-zinc-400 font-bold font-mono">Security Gateway</span>
            <button id="btn-lang-toggle" class="bg-zinc-900 border border-zinc-800 text-zinc-300 hover:text-white rounded-2xl px-3.5 py-2 text-sm font-bold transition-all flex items-center gap-1.5 cursor-pointer">
                <span class="material-symbols-outlined text-[16px] text-green-400">translate</span>
                <span>हिन्दी</span>
            </button>
        </header>

        <!-- 2. Header Section -->
        <div class="flex flex-col items-center justify-center text-center z-10 shrink-0 my-auto py-2">
            <div class="w-16 h-16 rounded-2xl bg-zinc-900 flex items-center justify-center mb-3 border border-zinc-800 shadow-inner text-green-400">
                <span class="material-symbols-outlined text-[34px]" data-weight="fill">directions_bus</span>
            </div>
            <h1 data-i18n="otp_title" class="text-2xl sm:text-3xl font-black text-white mb-1 tracking-tight">Driver Authentication</h1>
            <p data-i18n="otp_desc" class="text-sm text-zinc-400 font-medium">Authorized Transit Broadcasters Only</p>
        </div>

        <!-- 3. Form Matrix (Buttonless Auto-Verification) -->
        <div class="flex flex-col z-10 my-auto space-y-4" id="driver-auth-container">
            
            <!-- Phone Input Surface (h-16) -->
            <div class="bg-zinc-900 rounded-2xl border border-zinc-800 p-4 shadow-sm">
                <label data-i18n="otp_phone_label" class="block text-sm text-zinc-300 mb-2 uppercase tracking-wider font-bold">Driver Mobile Number</label>
                <div class="flex items-center bg-black rounded-2xl border border-zinc-800 focus-within:border-green-400 transition-all overflow-hidden h-16">
                    <span class="px-4 text-base text-zinc-400 border-r border-zinc-800 h-full flex items-center bg-zinc-900 font-mono font-bold">+91</span>
                    <input id="driver-phone" class="w-full bg-transparent border-none focus:ring-0 px-4 text-base text-white h-full placeholder-zinc-600 font-mono font-bold tracking-wider" placeholder="00000 00000" type="tel" maxlength="10" value="0000000000"/>
                    <button id="send-otp-btn" data-i18n="otp_send_btn" class="px-5 h-full text-sm text-green-400 bg-green-950/40 hover:bg-green-900/50 active:scale-95 transition-all flex items-center justify-center border-l border-zinc-800 font-bold cursor-pointer" type="button">
                        Send
                    </button>
                </div>
            </div>

            <!-- OTP Matrix Surface (Upscaled Boxes) -->
            <div id="otp-matrix-card" class="bg-zinc-900 rounded-2xl border border-zinc-800 p-4 shadow-sm transition-all">
                <div class="flex justify-between items-center mb-2.5">
                    <label data-i18n="otp_enter_code" class="block text-sm text-zinc-300 uppercase tracking-wider font-bold">4-Digit Security PIN</label>
                    <span class="text-xs text-green-400 font-bold flex items-center gap-1.5 font-mono">
                        <span class="w-2 h-2 rounded-full bg-green-400 animate-ping"></span>
                        Auto-Verify
                    </span>
                </div>
                
                <!-- 4 Large Digit Inputs (w-16 h-16) -->
                <div class="flex justify-between gap-3 mt-3">
                    <input class="otp-input w-16 h-16 rounded-2xl bg-black border border-zinc-800 text-center font-mono text-3xl text-white font-black transition-all focus:ring-0" maxlength="1" inputmode="numeric" pattern="[0-9]*" type="text" data-index="0" autofocus />
                    <input class="otp-input w-16 h-16 rounded-2xl bg-black border border-zinc-800 text-center font-mono text-3xl text-white font-black transition-all focus:ring-0" maxlength="1" inputmode="numeric" pattern="[0-9]*" type="text" data-index="1" />
                    <input class="otp-input w-16 h-16 rounded-2xl bg-black border border-zinc-800 text-center font-mono text-3xl text-white font-black transition-all focus:ring-0" maxlength="1" inputmode="numeric" pattern="[0-9]*" type="text" data-index="2" />
                    <input class="otp-input w-16 h-16 rounded-2xl bg-black border border-zinc-800 text-center font-mono text-3xl text-white font-black transition-all focus:ring-0" maxlength="1" inputmode="numeric" pattern="[0-9]*" type="text" data-index="3" />
                </div>

                <!-- Error & Success Feedback Alerts -->
                <div id="auth-error-msg" class="hidden mt-3.5 text-sm text-red-400 font-mono bg-red-950/50 border border-red-800/80 p-3.5 rounded-2xl flex items-center gap-2">
                    <span class="material-symbols-outlined text-[20px] text-red-400 shrink-0">error</span>
                    <span id="auth-error-text">Invalid code. SIH Demo OTP is 0000.</span>
                </div>

                <div id="auth-success-msg" class="hidden mt-3.5 text-sm text-green-400 font-mono bg-green-950/60 border border-green-500/70 p-4 rounded-2xl flex items-center justify-center gap-2 animate-pulse shadow-[0_0_20px_rgba(77,224,130,0.25)]">
                    <span class="material-symbols-outlined text-[22px] text-green-400 animate-spin">sync</span>
                    <span class="font-bold tracking-wide">PIN Verified! Redirecting...</span>
                </div>
            </div>
        </div>

        <!-- 4. Footer Helper / SIH Evaluation Notice -->
        <footer class="text-center pt-2 shrink-0 z-10">
            <div class="bg-zinc-900/90 border border-zinc-800 rounded-2xl py-3 px-4">
                <p class="font-mono text-zinc-300 text-sm">
                    <span class="text-green-400 font-bold">SIH Evaluator:</span> Mobile <code class="text-white font-bold text-base">0000000000</code> &bull; OTP <code class="text-white font-bold text-base">0000</code>
                </p>
            </div>
        </footer>
    </div>

    <!-- JavaScript: 100% Buttonless Auto-Verification Flow -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = Array.from(document.querySelectorAll('.otp-input'));
            const sendBtn = document.getElementById('send-otp-btn');
            const phoneInput = document.getElementById('driver-phone');
            const errorBox = document.getElementById('auth-error-msg');
            const errorText = document.getElementById('auth-error-text');
            const successBox = document.getElementById('auth-success-msg');
            const matrixCard = document.getElementById('otp-matrix-card');

            let cooldown = 0;
            let cooldownTimer = null;

            sendBtn.addEventListener('click', () => {
                const phone = phoneInput.value.trim();
                if (phone.length < 10) {
                    showError('Please enter a valid 10-digit mobile number.');
                    return;
                }
                if (cooldown > 0) return;

                hideFeedback();
                cooldown = 60;
                sendBtn.disabled = true;
                sendBtn.classList.add('opacity-50', 'cursor-not-allowed');

                cooldownTimer = setInterval(() => {
                    cooldown--;
                    sendBtn.textContent = `${cooldown}s`;
                    if (cooldown <= 0) {
                        clearInterval(cooldownTimer);
                        sendBtn.disabled = false;
                        sendBtn.textContent = 'Resend';
                        sendBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    }
                }, 1000);

                inputs[0].focus();
            });

            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    const val = e.target.value;
                    if (!/^\d*$/.test(val)) {
                        input.value = '';
                        return;
                    }
                    hideFeedback();
                    if (val.length === 1) {
                        input.classList.add('border-green-400');
                        if (index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        } else {
                            checkOtpInstant();
                        }
                    } else if (val.length === 0) {
                        input.classList.remove('border-green-400');
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !input.value && index > 0) {
                        inputs[index - 1].focus();
                    }
                });

                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pasteData = (e.clipboardData || window.clipboardData).getData('text').trim();
                    if (/^\d{4}$/.test(pasteData)) {
                        pasteData.split('').forEach((char, i) => {
                            if (inputs[i]) {
                                inputs[i].value = char;
                                inputs[i].classList.add('border-green-400');
                            }
                        });
                        inputs[3].focus();
                        checkOtpInstant();
                    }
                });
            });

            function checkOtpInstant() {
                const code = inputs.map(i => i.value).join('');
                if (code.length !== 4) return;

                if (code === '0000') {
                    hideFeedback();
                    successBox.classList.remove('hidden');

                    const driverSession = {
                        authenticated: true,
                        phone: phoneInput.value.trim() || '0000000000',
                        vehicle_plate: 'HR-02-AB-1234',
                        depot_id: 'DEPOT-YNR-01',
                        authenticated_at: Date.now()
                    };
                    sessionStorage.setItem('busradar_driver_session', JSON.stringify(driverSession));

                    inputs.forEach(inp => {
                        inp.disabled = true;
                        inp.classList.remove('border-zinc-800');
                        inp.classList.add('border-green-400', 'bg-green-950/40', 'text-green-300');
                    });

                    setTimeout(() => {
                        window.location.href = '../driver_telemetry_dashboard/code.html?v=' + Date.now();
                    }, 600);

                } else {
                    showError('Invalid PIN. SIH Demo OTP is 0000.');
                    matrixCard.classList.add('shake-animation');
                    setTimeout(() => matrixCard.classList.remove('shake-animation'), 400);

                    inputs.forEach(inp => {
                        inp.classList.remove('border-green-400');
                        inp.classList.add('border-red-500');
                        inp.value = '';
                    });
                    inputs[0].focus();
                }
            }

            function showError(msg) {
                errorText.textContent = msg;
                errorBox.classList.remove('hidden');
                successBox.classList.add('hidden');
            }

            function hideFeedback() {
                errorBox.classList.add('hidden');
                successBox.classList.add('hidden');
            }
        });
    </script>
    <!-- Universal i18n Engine Script -->
    <script src="../i18n.js"></script>
</body>
</html>
