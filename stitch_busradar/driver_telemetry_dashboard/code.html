<style>
    body {

        background-color: #09090b;

<body class="font-sans antialiased select-none text-zinc-100">

<!-- Fixed Native App Chassis -->
<div class="max-w-md mx-auto h-[100dvh] max-h-[850px] bg-black flex flex-col relative overflow-hidden w-full shadow-2xl rounded-none md:rounded-3xl border border-zinc-800">
    
<!-- Standardized Header (h-16) -->
<header class="bg-zinc-950 px-4 py-3 flex justify-between items-center border-b border-zinc-800/90 h-16 flex-shrink-0 z-20">
    <div class="flex items-center gap-2.5">
        <div class="w-11 h-11 rounded-2xl bg-zinc-900 border border-zinc-800 flex items-center justify-center text-green-400 shadow-inner">
            <span class="material-symbols-outlined text-[24px]">directions_bus</span>
        </div>
        <div>
            <h1 data-i18n="driver_title" class="text-white font-black text-lg tracking-tight leading-tight">BusRadar</h1>
            <span id="driver-phone-display" class="text-xs font-mono text-zinc-400 block">Driver: +91 0000000000</span>
        </div>
    </div>
    <div class="flex items-center gap-2">
        <button id="btn-lang-toggle" class="bg-zinc-900 hover:bg-zinc-800 text-zinc-300 hover:text-white border border-zinc-800 rounded-2xl px-3 py-2 text-xs font-bold active:scale-95 transition-all flex items-center gap-1.5 cursor-pointer">

        </button>
        <button id="btn-driver-logout" title="End Shift & Logout" class="bg-zinc-900 hover:bg-red-950/60 text-zinc-400 hover:text-red-400 border border-zinc-800 hover:border-red-900/80 rounded-2xl px-3 py-2 text-xs font-bold active:scale-95 transition-all flex items-center gap-1.5 cursor-pointer">
            <span class="material-symbols-outlined text-[16px]">logout</span>

        </button>
    </div>
</header>

<!-- Scaled-Up, High-Legibility Scrollable Content Area -->
<div class="flex-1 overflow-y-auto px-4 flex flex-col gap-4 pb-6 pt-3">

    <section class="bg-zinc-900 p-4 rounded-3xl flex flex-col gap-3.5 border border-zinc-800 shadow-sm relative z-30">
        <!-- Vehicle Plate Input (h-16) -->

            <label data-i18n="driver_plate_label" class="text-xs font-bold text-zinc-300 uppercase tracking-wider">Vehicle Plate Number</label>
            <input id="vehicle-plate" class="h-16 bg-black text-white rounded-2xl border border-zinc-800 focus:border-green-400 focus:outline-none px-4 placeholder:text-zinc-600 uppercase font-mono text-base font-black tracking-wider" value="HR-02-AB-1234" placeholder="HR-02-AB-1234" type="text"/>
        </div>
        
        <!-- Dual Autocomplete Combobox Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            
            <!-- 1. FROM (Starting Stop) Combobox (h-16) -->
            <div class="flex flex-col gap-1.5 relative">
                <label data-i18n="driver_from_label" class="text-xs font-bold text-zinc-300 uppercase tracking-wider">From (Starting Stop)</label>
                <div class="flex items-center bg-black rounded-2xl border border-zinc-800 focus-within:border-green-400 transition-all h-16 px-3.5">
                    <span class="material-symbols-outlined text-green-400 mr-2 text-[20px]">trip_origin</span>
                    <input id="start-stop" data-i18n-ph="driver_from_ph" class="w-full bg-transparent border-none p-0 text-xs sm:text-sm font-semibold text-white placeholder-zinc-500 focus:ring-0 focus:outline-none" placeholder="Search Origin: Yamuna Nagar..." type="text" value="Yamuna Nagar Bus Stand"/>
                    <button id="btn-clear-start" class="text-zinc-500 hover:text-white cursor-pointer flex items-center">
                        <span class="material-symbols-outlined text-[18px]">close</span>
                    </button>
                </div>
                <!-- Dropdown -->

            </div>
            
            <!-- 2. TO (Destination) Combobox (h-16) -->

                <label data-i18n="driver_to_label" class="text-xs font-bold text-zinc-300 uppercase tracking-wider">To (Destination)</label>

                    <span class="material-symbols-outlined text-red-400 mr-2 text-[20px]">location_on</span>

        </div>

        </div>
    </section>
</div>
</div>

    const sessionRaw = sessionStorage.getItem('busradar_driver_session');
    if (!sessionRaw) {
        window.location.href = '../otp_system/code.html';
        return;
    }
    try {
        const session = JSON.parse(sessionRaw);
        if (!session || !session.authenticated) {
            sessionStorage.removeItem('busradar_driver_session');
            window.location.href = '../otp_system/code.html';
        }
    } catch (e) {
        sessionStorage.removeItem('busradar_driver_session');
        window.location.href = '../otp_system/code.html';

})();

/**
 * 3. Dynamic Telemetry Publisher & Incident Dispatcher
 */
document.addEventListener('DOMContentLoaded', function () {
    const sessionRaw = sessionStorage.getItem('busradar_driver_session');
    if (sessionRaw) {
        try {
            const session = JSON.parse(sessionRaw);
            const phoneEl = document.getElementById('driver-phone-display');
            if (phoneEl && session.phone) {
                phoneEl.textContent = `Driver: +91 ${session.phone}`;
            }
        } catch (e) {}
    }

    const logoutBtn = document.getElementById('btn-driver-logout');
    if (logoutBtn) {
        logoutBtn.addEventListener('click', function () {
            if (confirm('End driver shift and return to login?')) {
                sessionStorage.removeItem('busradar_driver_session');
                window.location.href = '../otp_system/code.html';
            }
        });
    }

    const broadcastBtn = document.getElementById('btn-broadcast-toggle');
    const broadcastBtnText = document.getElementById('broadcast-btn-text');
    const streamCard = document.getElementById('live-stream-card');
    const latEl = document.getElementById('telemetry-lat');
    const lngEl = document.getElementById('telemetry-lng');
    const packetsEl = document.getElementById('telemetry-packets');
    const plateInput = document.getElementById('vehicle-plate');
    const startStopInput = document.getElementById('start-stop');
    const destStopInput = document.getElementById('dest-stop');
    const depTimeInput = document.getElementById('departure-time');
    const arrTimeInput = document.getElementById('arrival-time');
    const activeDelayBadge = document.getElementById('active-delay-badge');
    const delayNotice = document.getElementById('delay-broadcast-notice');
    const delayNoticeText = document.getElementById('delay-notice-text');

    let isBroadcasting = false;
    let packetCount = 0;
    let broadcastInterval = null;
    let socket = null;

    function initWebSocket() {
        const WS_URL = 'ws://localhost:8000/ws/telemetry';
        try {
            socket = new WebSocket(WS_URL);
            socket.onopen = () => console.log('✅ Driver Dashboard connected to WebSocket Hub');
            socket.onerror = () => console.warn('⚠️ WebSocket disconnected, running offline telemetry mode');
            socket.onclose = () => setTimeout(initWebSocket, 3000);
        } catch (err) {
            console.warn('WebSocket connect error:', err);
        }
    }

    initWebSocket();

    // Delay Dispatcher
    const delayButtons = document.querySelectorAll('.btn-delay-trigger');
    delayButtons.forEach(btn => {
        btn.addEventListener('click', function () {
            const delayMins = parseInt(this.getAttribute('data-delay'), 10);
            const reason = this.getAttribute('data-reason');
            const busId = plateInput ? (plateInput.value.trim() || 'HR-02-AB-1234') : 'HR-02-AB-1234';

            const delayPayload = {
                event_type: "DRIVER_DELAY",
                bus_id: busId,
                delay_minutes: delayMins,
                reason: reason,
                timestamp: Date.now()
            };

            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify(delayPayload));
            }

            if (activeDelayBadge) {
                if (delayMins > 0) {
                    activeDelayBadge.textContent = `+${delayMins}M DELAY (${reason.toUpperCase()})`;
                    activeDelayBadge.className = 'px-3 py-1 rounded-xl text-xs font-mono bg-amber-950 text-amber-300 border border-amber-600 font-bold animate-pulse';

                    if (delayNotice) {
                        delayNotice.className = 'mt-1 text-xs font-mono p-3 rounded-2xl bg-amber-950/50 border border-amber-700 text-amber-200 flex items-center gap-2';
                    }
                    if (delayNoticeText) {
                        delayNoticeText.textContent = `🚨 Multicasted: +${delayMins}m alert (${reason}) to waiting commuters.`;
                    }
                } else {
                    activeDelayBadge.textContent = 'ON TIME';
                    activeDelayBadge.className = 'px-3 py-1 rounded-xl text-xs font-mono bg-emerald-950 text-emerald-400 border border-emerald-800 font-bold';

                    if (delayNotice) {
                        delayNotice.className = 'mt-1 text-xs font-mono p-3 rounded-2xl bg-emerald-950/50 border border-emerald-700 text-emerald-200 flex items-center gap-2';
                    }
                    if (delayNoticeText) {
                        delayNoticeText.textContent = '✅ Delay cleared! Schedule restored to nominal ETA.';
                    }
                }
                if (delayNotice) delayNotice.classList.remove('hidden');
            }
        });
    });

    // GPS Broadcast Streamer
    let baseLat = 30.1290;
    let baseLng = 77.2674;
    let stepIndex = 0;

    if (broadcastBtn) {
        broadcastBtn.addEventListener('click', function () {
            if (!isBroadcasting) {
                isBroadcasting = true;
                if (streamCard) streamCard.classList.remove('hidden');
                if (broadcastBtnText) broadcastBtnText.textContent = 'STOP BROADCASTING';
                broadcastBtn.classList.remove('bg-green-400', 'text-black', 'hover:bg-[#48ff26]', 'shadow-[0_0_25px_rgba(77,224,130,0.35)]');
                broadcastBtn.classList.add('bg-red-600', 'text-white', 'hover:bg-red-500', 'shadow-[0_0_25px_rgba(239,68,68,0.35)]');

                broadcastInterval = setInterval(() => {
                    packetCount++;
                    if (packetsEl) packetsEl.textContent = packetCount;

                    stepIndex++;
                    const latJitter = parseFloat((baseLat + (stepIndex * 0.0004) % 0.015 + (Math.random() - 0.5) * 0.0006).toFixed(4));
                    const lngJitter = parseFloat((baseLng + (stepIndex * 0.0005) % 0.018 + (Math.random() - 0.5) * 0.0006).toFixed(4));
                    const speed = Math.floor(40 + (Math.random() - 0.5) * 10);
                    
                    const busId = plateInput ? (plateInput.value.trim() || 'HR-02-AB-1234') : 'HR-02-AB-1234';
                    const routeFrom = startStopInput ? (startStopInput.value.trim() || 'Yamuna Nagar Bus Stand') : 'Yamuna Nagar Bus Stand';
                    const routeTo = destStopInput ? (destStopInput.value.trim() || 'MMDU Campus Gate') : 'MMDU Campus Gate';
                    const depTime = depTimeInput ? (depTimeInput.value.trim() || '08:30') : '08:30';
                    const arrTime = arrTimeInput ? (arrTimeInput.value.trim() || '09:15') : '09:15';

                    if (latEl) latEl.textContent = `${latJitter}° N`;
                    if (lngEl) lngEl.textContent = `${lngJitter}° E`;

                    const payload = {
                        event_type: "DRIVER_TELEMETRY",
                        bus_id: busId,
                        route_from: routeFrom,
                        route_to: routeTo,
                        departure_time: depTime,
                        arrival_time: arrTime,
                        lat: latJitter,
                        lng: lngJitter,
                        speed_kmh: speed,
                        timestamp: Date.now()
                    };

                    if (socket && socket.readyState === WebSocket.OPEN) {
                        socket.send(JSON.stringify(payload));
                    }
                }, 1000);
            } else {
                isBroadcasting = false;
                clearInterval(broadcastInterval);
                if (streamCard) streamCard.classList.add('hidden');
                if (broadcastBtnText) broadcastBtnText.textContent = 'START LIVE BROADCAST';
                broadcastBtn.classList.remove('bg-red-600', 'text-white', 'hover:bg-red-500', 'shadow-[0_0_25px_rgba(239,68,68,0.35)]');
                broadcastBtn.classList.add('bg-green-400', 'text-black', 'hover:bg-[#48ff26]', 'shadow-[0_0_25px_rgba(77,224,130,0.35)]');
            }
        });
    }

    // Driver Autocomplete Combobox Engine (Enhanced Spacing)
    const fuse = new Fuse(transitLocations, {
        keys: ['name', 'subtitle', 'type'],
        threshold: 0.35,
        distance: 100,
        minMatchCharLength: 1
    });

    function setupDriverCombobox(inputId, clearBtnId, dropdownId) {
        const input = document.getElementById(inputId);
        const clearBtn = document.getElementById(clearBtnId);
        const dropdown = document.getElementById(dropdownId);

        function renderResults(results) {
            if (!results.length) {
                dropdown.innerHTML = `
                    <div class="px-4 py-3 text-xs text-zinc-500 text-center flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-[18px]">search_off</span>
                        <span>No stop found in Haryana DB.</span>
                    </div>
                `;
                dropdown.classList.remove('hidden');
                return;
            }

            dropdown.innerHTML = results.map(({ item }) => `
                <div class="combobox-item px-4 py-3 hover:bg-zinc-900 transition-colors cursor-pointer w-full group" data-name="${item.name}">
                    <div class="text-xs sm:text-sm font-bold text-white group-hover:text-green-400 transition-colors truncate">${item.name}</div>
                    <div class="text-[11px] font-medium text-zinc-400 truncate mt-0.5">${item.subtitle}</div>
                </div>
            `).join('');

            dropdown.classList.remove('hidden');

            dropdown.querySelectorAll('.combobox-item').forEach(el => {
                el.addEventListener('click', function () {
                    const selectedName = this.getAttribute('data-name');
                    input.value = selectedName;
                    dropdown.classList.add('hidden');
                    clearBtn.classList.remove('hidden');
                });
            });
        }

        input.addEventListener('input', function () {
            const query = this.value.trim();
            if (query.length > 0) {
                clearBtn.classList.remove('hidden');
                renderResults(fuse.search(query));
            } else {
                clearBtn.classList.add('hidden');
                dropdown.classList.add('hidden');
            }
        });

        clearBtn.addEventListener('click', function () {
            input.value = '';
            clearBtn.classList.add('hidden');
            dropdown.classList.add('hidden');
            input.focus();
        });

        document.addEventListener('click', function (e) {
            if (!input.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.classList.add('hidden');
            }
        });
    }

    setupDriverCombobox('start-stop', 'btn-clear-start', 'start-stop-dropdown');
    setupDriverCombobox('dest-stop', 'btn-clear-dest', 'dest-stop-dropdown');
});
</script>
